plugins {
	id 'java'
	id 'war'
	id 'org.springframework.boot' version '3.5.0-SNAPSHOT'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.finance.manager'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	maven { url = uri("https://repo.spring.io/milestone") }
	maven { url = uri("https://repo.spring.io/snapshot") }
}

dependencies {
	// Spring Boot Core
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Database
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.postgresql:postgresql'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Security for password hashing (from gateway service)
	implementation 'org.springframework.security:spring-security-crypto'

	// Logging
	implementation 'org.slf4j:slf4j-api'

	// Test dependencies
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// In-memory DB purely so the context-load smoke test can wire up a
	// DataSource/NamedParameterJdbcTemplate bean without a live Postgres -
	// unit tests mock the DAO layer directly and never touch this.
	testRuntimeOnly 'com.h2database:h2'
}

tasks.withType(Test) {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
	testLogging {
		events "passed", "skipped", "failed"
	}
}

jacocoTestReport {
	dependsOn test
	reports {
		html.required = true
		xml.required = true
	}
}

jacocoTestCoverageVerification {
	dependsOn jacocoTestReport
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.60
			}
		}
	}
	// DTOs/config have no branching logic - excluded from the denominator
	// rather than padded out with trivial getter/setter tests.
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: [
					'**/dto/**',
					'**/config/**',
					'**/*Application.class',
					'**/ServletInitializer.class'
			])
		}))
	}
}

check.dependsOn jacocoTestCoverageVerification

bootBuildImage {
	environment = ["BP_JVM_VERSION" : "21.0.6"]
	tags = ["finance-manager-api-gateway:${project.version}"]
	environment = [
			'SPRING_PROFILES_ACTIVE': 'local'
	]
}