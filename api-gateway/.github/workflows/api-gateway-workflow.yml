name: API Gateway CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'api-gateway/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'api-gateway/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew and run.sh
        run: |
          chmod +x gradlew
          chmod +x run.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image using run.sh
        working-directory: ./api-gateway
        run: ./run.sh prod --detach

      - name: Tag and push Docker image to GitHub Container Registry
        run: |
          docker tag finance-manager-application/api-gateway:latest ghcr.io/${{ github.repository }}/api-gateway:latest
          docker push ghcr.io/${{ github.repository }}/api-gateway:latest

      - name: Deploy to server
        if: github.event_name != 'pull_request'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          script: |
            # Pull the latest image
            docker pull ghcr.io/${{ github.repository }}/api-gateway:latest
            
            # Stop and remove the old container if it exists
            docker stop api-gateway || true
            docker rm api-gateway || true
            
            # Run the new container
            docker run -d --name api-gateway \
              -p 5001:5001 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e SPRING_DATASOURCE_URL=${{ secrets.POSTGRES_DB_URL }} \
              -e SPRING_DATASOURCE_USERNAME=${{ secrets.POSTGRES_DB_USERNAME }} \
              -e SPRING_DATASOURCE_PASSWORD=${{ secrets.POSTGRES_DB_PASSWORD }} \
              --restart=always \
              ghcr.io/${{ github.repository }}/api-gateway:latest