# Test-only datasource: an in-memory H2 database exists purely so
# @SpringBootTest's context-load smoke test can wire up a DataSource bean
# without requiring a live Postgres. Real service behavior is covered by
# Mockito-based unit tests (service/*Test.java), never by this.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
