name: Finance Manager UI CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'finance-manager-ui/**'
      - '.github/workflows/finance-manager-ui-deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finance-manager-ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and tag Docker image
        uses: docker/build-push-action@v4
        with:
          context: finance-manager-ui
          push: false
          tags: finance-manager-ui:latest
          load: true

      - name: Save Docker image
        run: docker save finance-manager-ui:latest > $GITHUB_WORKSPACE/finance-manager-ui.tar

      - name: Copy Docker image to server
        uses: appleboy/scp-action@master
        with:
          host: 31.57.224.242
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: finance-manager-ui.tar
          target: /tmp

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: 31.57.224.242
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Load the Docker image
            docker load < /tmp/finance-manager-ui.tar

            # Stop and remove the existing container if it exists
            docker stop finance-manager-ui || true
            docker rm finance-manager-ui || true

            # Run the new container
            docker run -d \
              --name finance-manager-ui \
              -p 8100:8100 \
              --restart unless-stopped \
              finance-manager-ui:latest

            # Clean up
            rm /tmp/finance-manager-ui.tar
