name: Statement Loader CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'statement-loader/**'
      - '.github/workflows/statement-loader-deploy.yml'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: statement-loader

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build and tag Docker image
        run: docker build -t finance-manager-statement-loader:latest .

      - name: Save Docker image
        run: docker save finance-manager-statement-loader:latest > $GITHUB_WORKSPACE/statement-loader.tar

      - name: Copy Docker image to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          source: statement-loader.tar
          target: /tmp

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          script: |
            # Load the Docker image
            docker load < /tmp/statement-loader.tar

            # Stop and remove the existing container if it exists
            docker stop statement-loader || true
            docker rm statement-loader || true

            # Run the new container
            docker run -d \
              --name statement-loader \
              --restart always \
              -p 5002:5002 \
              -v /.venv:/.venv \
              -v /finance_manager_application/logs:/finance_manager_application/logs \
              -e STATEMENT_LOADER_POSTGRES_HOST=${{ secrets.POSTGRES_DB_URL }} \
              -e STATEMENT_LOADER_POSTGRES_USER=${{ secrets.POSTGRES_DB_USERNAME }} \
              -e STATEMENT_LOADER_POSTGRES_PASSWORD=${{ secrets.POSTGRES_DB_PASSWORD }} \
              -e STATEMENT_LOADER_POSTGRES_DATABASE=finance_manager \
              -e STATEMENT_LOADER_POSTGRES_PORT=5432 \
              -e STATEMENT_LOADER_SERVER_HOST=0.0.0.0 \
              -e STATEMENT_LOADER_SERVER_PORT=5002 \
              finance-manager-statement-loader:latest

            # Clean up
            rm /tmp/statement-loader.tar
