<ion-menu contentId="main-content">
  <ion-header>
    <ion-toolbar>
      <ion-title>Menu</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <div class="user-info">
      <ion-icon name="person-outline" class="user-icon"></ion-icon>
      <h2>Welcome, {{ username }}</h2>
    </div>
    
    <ion-list>
      <ion-menu-toggle auto-hide="false">
        <ion-item button routerLink="/tabs/tab1" routerDirection="root">
          <ion-icon name="wallet-outline" slot="start"></ion-icon>
          <ion-label>Accounts</ion-label>
        </ion-item>
      </ion-menu-toggle>
      
      <ion-menu-toggle auto-hide="false">
        <ion-item button routerLink="/tabs/statement-uploader" routerDirection="root">
          <ion-icon name="cloud-upload-outline" slot="start"></ion-icon>
          <ion-label>Upload Statements</ion-label>
        </ion-item>
      </ion-menu-toggle>
      
      <ion-menu-toggle auto-hide="false">
        <ion-item button routerLink="/tabs/transactions" routerDirection="root">
          <ion-icon name="cash-outline" slot="start"></ion-icon>
          <ion-label>Transactions</ion-label>
        </ion-item>
      </ion-menu-toggle>
      
      <ion-menu-toggle auto-hide="false">
        <ion-item button routerLink="/tabs/categories" routerDirection="root">
          <ion-icon name="folder-outline" slot="start"></ion-icon>
          <ion-label>Categories</ion-label>
        </ion-item>
      </ion-menu-toggle>

      <ion-menu-toggle auto-hide="false">
        <ion-item button routerLink="/tabs/logout" routerDirection="root">
          <ion-icon name="exit-outline" slot="start"></ion-icon>
          <ion-label>Logout</ion-label>
        </ion-item>
      </ion-menu-toggle>

<!-- 
      <ion-menu-toggle auto-hide="false">
        <ion-button expand="block" color="danger" class="logout-button" (click)="logout()">
          <ion-icon name="exit-outline" slot="start"></ion-icon>
          Logout
        </ion-button>
      </ion-menu-toggle> -->

    </ion-list>

  </ion-content>
</ion-menu>

<div class="ion-page" id="main-content">
  <ion-tabs>
    <ion-tab-bar slot="bottom">
      <ion-tab-button tab="tab1" href="/tabs/tab1">
        <ion-icon aria-hidden="true" name="wallet-outline"></ion-icon>
        <ion-label>Accounts</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="statement-uploader" href="/tabs/statement-uploader">
        <ion-icon aria-hidden="true" name="cloud-upload-outline"></ion-icon>
        <ion-label>Upload statements</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="transactions" href="/tabs/transactions">
        <ion-icon aria-hidden="true" name="cash-outline"></ion-icon>
        <ion-label>Transactions</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="categories" href="/tabs/categories">
        <ion-icon aria-hidden="true" name="folder-outline"></ion-icon>
        <ion-label>Categories</ion-label>
      </ion-tab-button>

      <ion-tab-button tab="logout" href="/tabs/logout">
        <ion-icon aria-hidden="true" name="exit-outline"></ion-icon>
        <ion-label>Logout</ion-label>
      </ion-tab-button>

    </ion-tab-bar>
  </ion-tabs>
</div>
