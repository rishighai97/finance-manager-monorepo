name: Deploy UI Application

on:
  push:
    branches: [ main ]  # Adjust this to match your main branch name (could be master)
  workflow_dispatch:    # This allows manual triggering of the workflow

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'  # Choose the appropriate Node.js version for your project
        
    - name: Install dependencies
      run: npm ci
      
    # - name: Build application
    #   run: npm run build --prod
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Build and tag Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        tags: finance-manager-ui:latest
        load: true
        
    - name: Save Docker image
      run: docker save finance-manager-ui:latest > finance-manager-ui.tar
      
    - name: Copy Docker image to server
      uses: appleboy/scp-action@master
      with:
        host: 31.57.224.242
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: finance-manager-ui.tar
        target: /tmp
        
    - name: Deploy to server
      uses: appleboy/ssh-action@master
      with:
        host: 31.57.224.242
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Load the Docker image
          docker load < /tmp/finance-manager-ui.tar
          
          # Stop and remove the existing container if it exists
          docker stop finance-manager-ui || true
          docker rm finance-manager-ui || true
          
          # Run the new container
          docker run -d \
            --name finance-manager-ui \
            -p 8101:8101\
            --restart unless-stopped \
            finance-manager-ui:latest
          
          # Clean up
          rm /tmp/finance-manager-ui.tar