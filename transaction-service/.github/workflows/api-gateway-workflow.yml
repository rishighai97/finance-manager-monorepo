name: API Gateway CI/CD

on:
  push:
    branches: [ main ]
  #    paths:
  #      - 'transaction-service/**'
  pull_request:
    branches: [ main ]
  #    paths:
  #      - 'transaction-service/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew and run.sh
        run: |
          chmod +x gradlew
          chmod +x run.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and tag Docker image
        #        working-directory: ./transaction-service
        run: ./gradlew bootBuildImage --imageName finance-manager-transaction-service:latest

      - name: Save Docker image
        run: docker save finance-manager-transaction-service:latest > transaction-service.tar
      - name: Copy Docker image to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          source: transaction-service.tar
          target: /tmp
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          script: |
            # Load the Docker image
            docker load < /tmp/transaction-service.tar
            
            # Stop and remove the existing container if it exists
            docker stop transaction-service || true
            docker rm transaction-service || true
            
            # Run the new container
            docker run -d --name transaction-service \
              -p 5004:5004 \
              -v /finance_manager_application:/finance_manager_application \
              -e SPRING_PROFILES_ACTIVE=prod \
              --restart=always \
              finance-manager-transaction-service:latest
            
            # Clean up
            rm /tmp/transaction-service.tar